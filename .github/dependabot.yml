version: 2
updates:
  # npm dependencies (package.json). Weekly, not daily - this is a small
  # team, and a PR flood on every minor bump isn't actionable. Security
  # updates land separately/immediately via the repo's own
  # dependabot_security_updates setting, regardless of this schedule.
  # Mirrors the comprobify API repo's own .github/dependabot.yml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 6.x never had a real release (dev/beta channel only) - 5.x
      # jumps straight to 7.x, which is "Project Corsa," a ground-up native
      # Go rewrite of the compiler, not a routine major bump. Confirmed
      # build-breaking against this repo's Next.js 16.2.4 toolchain (#138,
      # closed 2026-09-14): next build's own TypeScript-detection logic
      # doesn't recognize the native compiler as a valid install, tries to
      # auto-reinstall typescript mid-build, then crashes. tsc --noEmit alone
      # doesn't catch this - only a real `next build` does. Remove this once
      # Next.js/this repo's toolchain has real TS7 support and someone
      # deliberately re-tests it - don't just delete it because Dependabot
      # stops proposing 5.x updates and it looks stale.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Only minor/patch bumps get grouped - a major version can carry real
      # breaking changes and deserves its own reviewable PR regardless of
      # which package it is, not buried in a dozen-package bundle. next,
      # next-auth, @auth/core, and prisma/@prisma/client are excluded from
      # the group entirely, major or not - the framework, the auth library,
      # and the DB client are load-bearing enough to always get individual
      # attention (also historically carried real audit findings, since
      # triaged - so their updates need to be reviewed deliberately, not
      # merged as part of a routine bundle).
      routine:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "next-auth"
          - "@auth/core"
          - "prisma"
          - "@prisma/*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions - keeps the SHA-pinned third-party actions
  # (appleboy/*, hashicorp/setup-terraform, aquasecurity/trivy-action)
  # current without anyone having to manually re-resolve a digest. Dependabot understands the
  # `@<sha> # vX.Y.Z` comment convention used throughout this repo's
  # workflows and bumps both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Same reasoning as npm's routine group above. appleboy/* (ssh-action,
      # scp-action) handle the actual production/staging deploy's SSH/SCP
      # steps - excluded from the group entirely (regardless of bump size)
      # since a behavior change there wouldn't surface until a real deploy
      # runs, not in CI.
      routine:
        patterns:
          - "*"
        exclude-patterns:
          - "appleboy/*"
        update-types:
          - "minor"
          - "patch"
