name: Terraform

# Applies infrastructure changes under terraform/ - separate from and never triggered by
# release-staging.yml/release-production.yml themselves (this workflow doesn't touch
# staging/production branches). Mirrors comprobify/.github/workflows/terraform.yml's shape,
# with one deliberate difference in the trigger - see below.
#
# TRIGGER: runs after release-staging.yml completes, not on every push to main. This repo's
# digitalocean_app resource couples "infra config" (build/run commands, env vars) with
# "which branch's code to build" (github.branch) into one resource - Terraform's create/
# update call blocks waiting for App Platform to actually deploy that code, and fails (
# tainting the resource) if it can't. If this ran on every push to main, a PR that changes
# both terraform/** and package.json (e.g. renaming an npm script a run_command depends on)
# would trigger an apply that tries to deploy the new spec against whatever's still on
# `staging` - which hasn't caught up yet, since staging only moves via the tagged release
# process. That's exactly what happened when this was still push-triggered: repeated
# deployment failures traced back to staging being several commits behind main the whole
# time. Triggering off release-staging.yml's completion instead guarantees staging has
# already been fast-forwarded (and App Platform's own Autodeploy already given a chance to
# pick up that code) before Terraform ever tries to create/update the app against it.
#
# All 10 secrets (DO_TOKEN, CLOUDFLARE_TOKEN, and the 8 TF_VAR_* app secrets below) live in
# the `staging` GitHub Environment (Settings -> Environments -> staging) - dedicated,
# freshly-minted credentials for this repo's pipeline, not reused from the comprobify API
# repo's own tokens. Unlike the API repo, there's no separate deploy workflow here to split
# infra credentials from app secrets across two Environments: Terraform IS what sets this
# app's secret env vars (via the env{} blocks in modules/app-platform/main.tf), so the same
# job needs both DO_TOKEN/CLOUDFLARE_TOKEN (to authenticate the providers) and every app
# secret (to populate those env blocks) in one terraform apply. A single GitHub Actions job
# can only be tied to one Environment at a time, so splitting these across a second
# Environment isn't possible without a second, currently-nonexistent workflow to hold it.
#
# TERRAFORM_SPACES_ACCESS_KEY_ID/SECRET_ACCESS_KEY are repository secrets, not Environment
# secrets, holding a Spaces access key scoped to the shared comprobify-terraform-state
# bucket (see terraform/environments/staging/backend.tf) - dedicated to this repo's
# pipeline, not the API repo's own Spaces key.
#
# Manual workflow_dispatch supports both apply (default) and destroy, so a teardown - or an
# ad-hoc apply outside the normal release cadence - can be run deliberately through this
# same audited pipeline instead of requiring local Terraform CLI access. destroy is only
# ever reachable via an explicit manual dispatch, never the automatic post-release trigger.

on:
  workflow_run:
    workflows: ["Release to Staging"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        type: choice
        options: [apply, destroy]
        default: apply

env:
  TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
  TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
  TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
  TF_VAR_auth_secret: ${{ secrets.AUTH_SECRET }}
  TF_VAR_encryption_key: ${{ secrets.ENCRYPTION_KEY }}
  TF_VAR_context_cookie_secret: ${{ secrets.CONTEXT_COOKIE_SECRET }}
  TF_VAR_database_ssl_ca: ${{ secrets.DATABASE_SSL_CA }}
  TF_VAR_sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
  TF_VAR_mailgun_api_key: ${{ secrets.MAILGUN_API_KEY }}
  TF_VAR_comprobify_admin_secret: ${{ secrets.COMPROBIFY_ADMIN_SECRET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}

jobs:
  plan:
    # Only run for a manual dispatch, or a release-staging.yml run that actually succeeded -
    # a failed release means staging never got fast-forwarded, so applying now would hit the
    # exact same stale-staging problem this trigger change exists to prevent.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5
      - run: terraform -chdir=terraform/environments/staging init
      - name: Plan (apply)
        if: github.event.inputs.action != 'destroy'
        run: terraform -chdir=terraform/environments/staging plan
      - name: Plan (destroy)
        if: github.event.inputs.action == 'destroy'
        run: terraform -chdir=terraform/environments/staging plan -destroy

  apply:
    needs: plan
    # Same guard as plan - needs: plan already skips this when plan is skipped, but stated
    # explicitly so the intent isn't left to the implicit skip-cascade alone.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5
      - run: terraform -chdir=terraform/environments/staging init
      - name: Apply
        if: github.event.inputs.action != 'destroy'
        run: terraform -chdir=terraform/environments/staging apply -auto-approve
      - name: Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform -chdir=terraform/environments/staging destroy -auto-approve
