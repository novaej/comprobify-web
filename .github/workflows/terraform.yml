name: Terraform

# Applies infrastructure changes under terraform/ - mirrors
# comprobify/.github/workflows/terraform.yml's shape exactly, including the trigger and
# the staging-infra Environment split.
#
# TRIGGER: push to `main` touching terraform/**, or manual workflow_dispatch. Terraform
# only ever manages the droplet/firewall/DNS here - never app code or app secrets (those
# are deploy-staging.yml's job, over SSH) - so there's no coupling between "which infra
# spec is applied" and "which app code is currently deployed" the way there would be for
# a PaaS's own app-spec resource. An infra change can be reviewed and applied the moment
# it's merged, without waiting for the next tagged release.
#
# DO_TOKEN/CLOUDFLARE_TOKEN live in the `staging-infra` GitHub Environment (Settings ->
# Environments -> staging-infra), unprefixed - same convention deploy-staging.yml uses
# for its own secrets: one secret name, a different value per Environment, not a name per
# environment. Deliberately a SEPARATE Environment from `staging` (which deploy-staging.yml
# uses for app secrets + DROPLET_IP/INFRA_SSH_PRIVATE_KEY) - this is the credential/blast-
# radius boundary: a required-reviewer rule can be added to staging-infra alone (repo
# Settings -> Environments -> staging-infra -> Required reviewers) to gate infra changes
# specifically, without also gating every app deploy.
#
# Both `plan` and `apply` declare `environment: staging-infra` - not just `apply`. GitHub
# only grants a job access to an Environment's secrets if that job declares it, which also
# means that Environment's protection rules apply to that job too. Declaring it on both
# means a required-reviewer rule on staging-infra gates `plan` as well as `apply` - you'd
# approve before seeing the plan's diff, not after reading it. Deliberate trade-off for
# staying consistent with deploy-staging.yml's single-environment-per-workflow shape,
# rather than introducing a second, plan-only Environment just to keep `plan` ungated.
#
# TERRAFORM_SPACES_ACCESS_KEY_ID/SECRET_ACCESS_KEY are repository secrets, not Environment
# secrets, holding a Spaces access key scoped to the shared comprobify-terraform-state
# bucket (see terraform/environments/staging/backend.tf) - dedicated to this repo's
# pipeline, not the API repo's own Spaces key. They stay repository-scoped because every
# job needs them regardless of which Environment (staging-infra today, production-infra
# later) it declares - there's only ever one correct value.
#
# Manual workflow_dispatch supports both apply (default) and destroy, so a teardown - or an
# ad-hoc apply outside the normal push trigger - can be run deliberately through this
# same audited pipeline instead of requiring local Terraform CLI access. destroy is only
# ever reachable via an explicit manual dispatch, never the automatic push trigger.

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        type: choice
        options: [apply, destroy]
        default: apply

env:
  TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
  TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: staging-infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5
      - run: terraform -chdir=terraform/environments/staging init
      - name: Plan (apply)
        if: github.event.inputs.action != 'destroy'
        run: terraform -chdir=terraform/environments/staging plan
      - name: Plan (destroy)
        if: github.event.inputs.action == 'destroy'
        run: terraform -chdir=terraform/environments/staging plan -destroy

  apply:
    needs: plan
    environment: staging-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5
      - run: terraform -chdir=terraform/environments/staging init
      - name: Apply
        if: github.event.inputs.action != 'destroy'
        run: terraform -chdir=terraform/environments/staging apply -auto-approve
      - name: Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform -chdir=terraform/environments/staging destroy -auto-approve
