name: Deploy Staging

# DISABLED — staging's droplet is destroyed (STAGING_INFRA_ENABLED=false, see
# terraform.yml/terraform-digitalocean-setup.md's "Toggling staging infra on/off").
# release-staging.yml keeps fast-forwarding the `staging` branch on every tag push
# regardless - that's harmless, just git branch bookkeeping - but this workflow would
# SSH to a DROPLET_IP that no longer resolves to anything, failing every single run
# until the droplet exists again. Re-enable in the same cycle as flipping
# STAGING_INFRA_ENABLED back to true and re-provisioning: uncomment the `push` trigger
# below and remove the `if: false` guard on the `deploy` job. Mirrors the identical
# pattern the comprobify API repo adopted once its own production went live.
#
# Builds the Next.js app into a Docker image and ships it to the staging droplet.
# comprobify-web had no equivalent of this workflow before the App Platform -> droplet
# migration - App Platform's own GitHub-source autodeploy watched the `staging` branch
# directly, so release-staging.yml's fast-forward push was the entire deploy mechanism.
# Mirrors comprobify/.github/workflows/deploy-staging.yml's shape.

on:
  # push:
  #   branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    if: false  # remove this line to re-enable
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* and SENTRY_AUTH_TOKEN must be present at *build* time - Next.js
      # inlines NEXT_PUBLIC_* into the bundle during `next build`, and the Sentry
      # webpack/turbopack plugin only runs during that same build step. DATABASE_URL
      # is also needed at build time, even though nothing connects to it then - see
      # the Dockerfile's ARG DATABASE_URL comment for why. None of these are read
      # again once the container starts. Everything else the app needs lives only in
      # the runtime .env file written below.
      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_MARKETING_URL="${{ vars.NEXT_PUBLIC_MARKETING_URL }}" \
            --build-arg NEXT_PUBLIC_APP_ENV="${{ vars.NEXT_PUBLIC_APP_ENV }}" \
            --build-arg DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ vars.NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --build-arg SENTRY_RELEASE="${{ github.sha }}" \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      # Informational only for now (exit-code 0) — the current base image
      # (node:24-slim) may carry HIGH/CRITICAL upstream findings that haven't
      # been individually triaged yet, same situation the comprobify API repo
      # hit first (docs/security-audit-2026-09-12.md #5 over there). Flip to
      # exit-code 1 once a baseline triage is done here too, so this actually
      # gates the deploy instead of just reporting.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      # username here must match `deploy_username` in
      # terraform/environments/staging/terraform.tfvars - the unprivileged user
      # cloud-init creates on the droplet (docker group only, no sudo, no root login
      # at all). SSH itself is open to the internet (see terraform/modules/droplet's
      # firewall rule for port 22) - defense is key-only auth + this privilege
      # separation + fail2ban, not IP restriction. Same model as the comprobify API
      # repo's own droplet.
      #
      # appleboy/scp-action and appleboy/ssh-action pinned to commit SHAs, not just
      # their mutable version tags — both handle INFRA_SSH_PRIVATE_KEY and write the
      # droplet's entire .env (every staging/production secret); a compromised
      # maintainer account re-pointing a tag could otherwise exfiltrate everything
      # with no diff in this repo to catch it in review. Mirrors the identical fix in
      # the comprobify API repo (docs/security-audit-2026-09-12.md finding #4 over
      # there).
      - name: Copy compose files to droplet
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: cpfywebdeploy9x
          key: ${{ secrets.INFRA_SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.yml,deploy/caddy/Caddyfile"
          target: /opt/comprobify-web
          strip_components: 1

      - name: Write env and restart containers
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: cpfywebdeploy9x
          key: ${{ secrets.INFRA_SSH_PRIVATE_KEY }}
          script: |
            cat > /opt/comprobify-web/.env <<'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DATABASE_SSL=${{ vars.DATABASE_SSL }}
            DATABASE_SSL_CA=${{ secrets.DATABASE_SSL_CA }}
            COMPROBIFY_API_URL=${{ vars.COMPROBIFY_API_URL }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_MARKETING_URL=${{ vars.NEXT_PUBLIC_MARKETING_URL }}
            PUBLIC_DOMAIN_PRIMARY=${{ vars.PUBLIC_DOMAIN_PRIMARY }}
            PUBLIC_DOMAIN_ALIAS=${{ vars.PUBLIC_DOMAIN_ALIAS }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            CONTEXT_COOKIE_SECRET=${{ secrets.CONTEXT_COOKIE_SECRET }}
            SENTRY_DSN=${{ vars.SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            APP_ENV=${{ vars.APP_ENV }}
            NEXT_PUBLIC_APP_ENV=${{ vars.NEXT_PUBLIC_APP_ENV }}
            MAILGUN_API_KEY=${{ secrets.MAILGUN_API_KEY }}
            MAILGUN_DOMAIN=${{ vars.MAILGUN_DOMAIN }}
            MAILGUN_FROM=${{ vars.MAILGUN_FROM }}
            COMPROBIFY_ADMIN_SECRET=${{ secrets.COMPROBIFY_ADMIN_SECRET }}
            INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET }}
            SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}
            SUPPORT_PHONE=${{ vars.SUPPORT_PHONE }}
            EOF
            chmod 600 /opt/comprobify-web/.env
            cd /opt/comprobify-web
            export IMAGE_TAG=${{ github.sha }}
            export APP_ENV=${{ vars.APP_ENV }}
            # The docker/login-action step earlier only authenticates the GitHub
            # Actions runner's own Docker daemon (so it can push) - the droplet's
            # daemon, pulling over this SSH session, has never logged into GHCR and
            # needs its own login. Reuses this job's own GITHUB_TOKEN rather than a
            # separate long-lived PAT - it's re-issued fresh every run anyway.
            #
            # A heredoc feeds the token to --password-stdin instead of `echo "$TOKEN" |
            # docker login`: piping through echo puts the token in that process's own
            # argv, visible via `ps` on this host for the run's duration; a heredoc
            # delivers it straight to docker login's stdin, never appearing as a
            # command-line argument anywhere. `docker logout` right after the pull (the
            # only step that needs registry auth - `up`/`exec` don't) clears the token
            # back out of ~/.docker/config.json instead of leaving it there indefinitely.
            docker login ghcr.io -u ${{ github.actor }} --password-stdin <<'GHCR_LOGIN'
            ${{ secrets.GITHUB_TOKEN }}
            GHCR_LOGIN
            docker compose pull
            docker logout ghcr.io
            docker compose up -d
            # docker compose up -d only recreates a container when the service
            # definition itself changes (image tag, env, volumes list) - Caddyfile
            # is bind-mounted, so a content-only change on disk is invisible to
            # Compose and the running caddy container keeps serving whatever config
            # it loaded at startup. Reload explicitly so a Caddyfile-only change
            # actually takes effect.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
