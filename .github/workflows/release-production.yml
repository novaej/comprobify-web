name: Release to Production

# Promotes a released tag to the `production` branch by fast-forwarding it to
# the tag the release was published from. `deploy-production.yml` (a separate
# workflow) is what actually builds and ships the image once this workflow's
# fast-forward push lands.
#
# Staging deploys directly and continuously off `main` (deploy-staging.yml, no
# tag involved) — so by the time a commit is tagged, it's typically already
# been running there for a while. A published GitHub Release means: "ship this
# to production." Publishing the release is the deliberate approval gate.
#
# Production branch/ruleset, GitHub Environment, terraform apply, and database
# setup were all completed as of 2026-09-14 — see
# docs/deployment-reference-production.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Fast-forward production to the released tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout production
          git merge --ff-only "${{ github.event.release.tag_name }}"
          git push origin production
