name: Release to Production

# Promotes a released tag to the `production` branch by fast-forwarding it to
# the tag the release was published from. `deploy-production.yml` (a separate
# workflow) is what actually builds and ships the image once this workflow's
# fast-forward push lands, the same split staging already uses.
#
# A published GitHub Release (created from a tag already validated in staging)
# means: "staging confirmed it, ship to production." Publishing the release is
# the deliberate approval gate between staging and production.
#
# See docs/production-readiness-checklist.md for the full history of what was
# needed to enable this (production branch/ruleset, GitHub Environment,
# terraform apply, database setup) — all done as of 2026-09-14.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Fast-forward production to the released tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout production
          git merge --ff-only "${{ github.event.release.tag_name }}"
          git push origin production
