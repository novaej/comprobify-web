name: Deploy Production

# DISABLED — the production droplet, `production` branch, and the `production` GitHub
# Environment's secrets/variables don't exist yet. Mirrors deploy-staging.yml exactly
# (same build/SCP/SSH shape, same GHCR image, same Caddy-reload retry) — only the
# environment name, deploy user, and the .env values written on the droplet differ.
#
# `username:` below (cpfywebdeploy4c7a) must match `deploy_username` in
# terraform/environments/production/terraform.tfvars — re-confirm if that value ever
# changes.
#
# See docs/production-readiness-checklist.md for what's left before this can be enabled:
#   1. Create the `production` branch (see docs/deployment.md)
#   2. terraform apply terraform/environments/production (own dedicated SSH key pair —
#      never reuse staging's)
#   3. Populate the `production` GitHub Environment (DROPLET_IP, INFRA_SSH_PRIVATE_KEY,
#      plus every app Secret/Variable — see docs/deployment-reference-production.md)
#   4. Uncomment the `push:` trigger below and remove the `if: false` guard on the
#      `deploy` job
on:
  # push:
  #   branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: false # remove this line to re-enable
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* and SENTRY_AUTH_TOKEN must be present at *build* time - Next.js
      # inlines NEXT_PUBLIC_* into the bundle during `next build`, and the Sentry
      # webpack/turbopack plugin only runs during that same build step. DATABASE_URL
      # is also needed at build time, even though nothing connects to it then - see
      # the Dockerfile's ARG DATABASE_URL comment for why. None of these are read
      # again once the container starts. Everything else the app needs lives only in
      # the runtime .env file written below.
      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_MARKETING_URL="${{ vars.NEXT_PUBLIC_MARKETING_URL }}" \
            --build-arg NEXT_PUBLIC_APP_ENV="${{ vars.NEXT_PUBLIC_APP_ENV }}" \
            --build-arg DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ vars.NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --build-arg SENTRY_RELEASE="${{ github.sha }}" \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      # Informational only for now (exit-code 0) — see deploy-staging.yml's matching
      # step for why. Triage this baseline (and flip to exit-code 1) before the first
      # real production deploy, not after — see docs/production-readiness-checklist.md.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      # username here must match `deploy_username` in
      # terraform/environments/production/terraform.tfvars - the unprivileged user
      # cloud-init creates on the droplet (docker group only, no sudo, no root login
      # at all). SSH itself is open to the internet (see terraform/modules/droplet's
      # firewall rule for port 22) - defense is key-only auth + this privilege
      # separation + fail2ban, not IP restriction. Same model as staging and the
      # comprobify API repo's own droplet.
      #
      # appleboy/scp-action and appleboy/ssh-action pinned to commit SHAs, not just
      # their mutable version tags — see deploy-staging.yml's matching comment for why
      # (docs/security-audit-2026-09-12.md finding #4 in the comprobify API repo).
      - name: Copy compose files to droplet
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: cpfywebdeploy4c7a
          key: ${{ secrets.INFRA_SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.yml,deploy/caddy/Caddyfile"
          target: /opt/comprobify-web
          strip_components: 1

      - name: Write env and restart containers
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: cpfywebdeploy4c7a
          key: ${{ secrets.INFRA_SSH_PRIVATE_KEY }}
          script: |
            cat > /opt/comprobify-web/.env <<'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DATABASE_SSL=${{ vars.DATABASE_SSL }}
            DATABASE_SSL_CA=${{ secrets.DATABASE_SSL_CA }}
            COMPROBIFY_API_URL=${{ vars.COMPROBIFY_API_URL }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_MARKETING_URL=${{ vars.NEXT_PUBLIC_MARKETING_URL }}
            PUBLIC_DOMAIN_PRIMARY=${{ vars.PUBLIC_DOMAIN_PRIMARY }}
            PUBLIC_DOMAIN_ALIAS=${{ vars.PUBLIC_DOMAIN_ALIAS }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            CONTEXT_COOKIE_SECRET=${{ secrets.CONTEXT_COOKIE_SECRET }}
            SENTRY_DSN=${{ vars.SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            APP_ENV=${{ vars.APP_ENV }}
            NEXT_PUBLIC_APP_ENV=${{ vars.NEXT_PUBLIC_APP_ENV }}
            MAILGUN_API_KEY=${{ secrets.MAILGUN_API_KEY }}
            MAILGUN_DOMAIN=${{ vars.MAILGUN_DOMAIN }}
            MAILGUN_FROM=${{ vars.MAILGUN_FROM }}
            COMPROBIFY_ADMIN_SECRET=${{ secrets.COMPROBIFY_ADMIN_SECRET }}
            INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET }}
            SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}
            SUPPORT_PHONE=${{ vars.SUPPORT_PHONE }}
            EOF
            chmod 600 /opt/comprobify-web/.env
            cd /opt/comprobify-web
            export IMAGE_TAG=${{ github.sha }}
            export APP_ENV=${{ vars.APP_ENV }}
            # The docker/login-action step earlier only authenticates the GitHub
            # Actions runner's own Docker daemon (so it can push) - the droplet's
            # daemon, pulling over this SSH session, has never logged into GHCR and
            # needs its own login. Reuses this job's own GITHUB_TOKEN rather than a
            # separate long-lived PAT - it's re-issued fresh every run anyway.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            # docker compose up -d only recreates a container when the service
            # definition itself changes - Caddyfile is bind-mounted, so a
            # content-only change on disk is invisible to Compose and the running
            # caddy container keeps serving whatever config it loaded at startup.
            # Reload explicitly so a Caddyfile-only change actually takes effect.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
