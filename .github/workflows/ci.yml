name: CI

# Runs a build-correctness and dependency-audit gate on every PR and push to main.
# Mirrors the comprobify API repo's own ci.yml (added per its
# docs/security-audit-2026-09-12.md finding #6) adapted to what this repo actually
# has: no test runner is configured here (package.json has no `test` script, no
# Jest/Vitest, no tests/ directory — see docs/guides/encryption-key-rotation.md's
# note on the same gap for scripts/rotate-encryption-key.js) — `tsc --noEmit` is the
# closest available correctness gate, so that's what runs instead of a unit suite.
#
# npm audit is deliberately NOT --audit-level=high blocking yet, unlike the API
# repo's equivalent. The backlog has since been triaged down from 24 findings (3
# critical) to 4 HIGH/0 critical — all 4 collapse to two upstream advisories
# bundled inside Prisma's own CLI tooling (deepmerge-ts stack exhaustion, not
# reachable here; mysql2 auth-downgrade/DoS, irrelevant since this app's
# schema.prisma is postgresql-only) with no available same-major patch yet.
# Kept informational (continue-on-error: true) for these four specifically —
# revisit once Prisma ships a 7.x patch, or as part of a deliberate Prisma 8
# migration once it's GA.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Type-check and audit
    runs-on: ubuntu-latest
    # Throwaway Postgres for the RLS integration tests (ADR-010). Its POSTGRES_USER is a
    # superuser, which bypasses RLS - so the tests connect as a separate non-superuser role
    # created below, exactly like the real app role.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # tsc --noEmit needs @prisma/client's generated types to exist first -
      # without this, every Prisma-typed import resolves to `any`/"has no
      # exported member", cascading into ~60 unrelated-looking errors across
      # the codebase. `npm run build:deploy` runs this same step before
      # `next build` for the identical reason - see Dockerfile.
      - run: npx prisma generate

      - name: Type-check
        run: npm run type-check

      # Real-Postgres RLS tests: migrate a *_test database as a non-superuser that owns
      # it (same shape as production's app role), then run them against it.
      - name: RLS integration tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE app_ci LOGIN PASSWORD 'app_ci' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE comprobify_web_test OWNER app_ci"
          export DATABASE_URL=postgresql://app_ci:app_ci@localhost:5432/comprobify_web_test
          npx prisma migrate deploy
          npm run test:integration

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
